spring:
  main:
    web-application-type: servlet
  application:
    name: thinkmap
  config:
    import: optional:file:.env[.properties]

  # ── H2 인메모리 DB (개발·데모용) ──────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:thinkmap;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # ── MySQL (운영 전환 시 아래 주석 해제, H2 설정 주석 처리) ──────
  #datasource:
  #  driver-class-name: com.mysql.cj.jdbc.Driver
  #  url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/thinkmap_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
  #  username: ${LOCAL_DB_USERNAME:root}
  #  password: ${LOCAL_DB_PASSWORD:password}

  mvc:
    async:
      request-timeout: 150s  # 인사이트 생성(최대 120s) + 여유 30s

  jpa:
    defer-datasource-initialization: true  # Hibernate DDL 완료 후 data.sql 실행 보장
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # ── MySQL 전환 시 아래 주석 해제 ─────────────────────────────
  #jpa:
  #  hibernate:
  #    ddl-auto: update
  #  properties:
  #    hibernate:
  #      format_sql: true
  #      database-platform: org.hibernate.dialect.MySQLDialect
  #  show-sql: false

  sql:
    init:
      mode: embedded   # H2처럼 내장 DB에서만 SQL 스크립트 실행 (data.sql 없어도 경고 없음)

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false   # LocalDateTime → ISO-8601 문자열 직렬화
    deserialization:
      fail-on-unknown-properties: false  # 프론트가 알 수 없는 필드 보내도 에러 없음
    mapper:
      accept-case-insensitive-enums: true  # "question" → QUESTION 자동 매핑

  # ── OAuth2 소셜 로그인 ────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://ec2-13-124-2-12.ap-northeast-2.compute.amazonaws.com:8080/login/oauth2/code/kakao"
            scope: profile_nickname, account_email, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

gemini:
  api:
    key: ${GEMINI_API_KEY:test-key}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    # gemini-1.5-flash: 빠르고 무료 티어 지원. 인사이트 생성에도 충분한 품질.
    # 더 높은 품질: gemini-1.5-pro / 최신 모델: gemini-2.0-flash-exp
    model: ${GEMINI_MODEL:gemini-2.5-flash}

# ── Swagger UI ─────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha          # 태그 알파벳 순 정렬
    operations-sorter: alpha    # 엔드포인트 알파벳 순 정렬
  api-docs:
    path: /v3/api-docs
  use-management-port: false
  packages-to-scan: com.example.thinkmap.controller

# ── CORS 허용 오리진 (개발용) ──────────────────────────────────
app:
  cors:
    origins: "http://localhost:8080,http://localhost:5173,http://localhost:3000,http://ec2-13-124-2-12.ap-northeast-2.compute.amazonaws.com:3000,http://ec2-13-124-2-12.ap-northeast-2.compute.amazonaws.com:5173,http://ec2-13-124-2-12.ap-northeast-2.compute.amazonaws.com:8080,https://kit-vcoding.netlify.app"
  auth:
    token-secret: ${JWT_SECRET:thisIsAVeryLongSecretKeyForJwtTokenGenerationThatMustBeAtLeast256BitsLong!}
    token-expiration-msec: 86400000   # 24시간
  oauth2:
    authorized-redirect-uris:
      - http://localhost:3000/oauth2/redirect
      - http://localhost:5173/oauth2/redirect
      - http://ec2-13-124-2-12.ap-northeast-2.compute.amazonaws.com:3000/oauth2/redirect
      - http://ec2-13-124-2-12.ap-northeast-2.compute.amazonaws.com:5173/oauth2/redirect
      - https://kit-vcoding.netlify.app/oauth2/redirect

# ── 로깅 ──────────────────────────────────────────────────────
logging:
  file:
    name: logs/thinkmap-app.log  # 로그 파일 경로 및 이름
    logback:
      rollingpolicy:
        max-file-size: 10MB        # 한 파일당 최대 용량
        max-history: 15            # 보관 기간 (일)
        total-size-cap: 1GB        # 전체 로그 파일 합계 제한
        file-name-pattern: ${LOG_FILE}-%d{yyyy-MM-dd}.%i.log
  level:
    com.example.thinkmap: DEBUG
    org.hibernate.SQL: DEBUG
